<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سوقي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1><a href="index.html">🛒 سوقي</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="categories.html">الفئات</a></li>
                    <li><a href="post-ad.html" class="btn-post">+ نشر إعلان</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">تسجيل الدخول</a>
                <a href="register.html" class="btn-register">إنشاء حساب</a>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
    </header>

    <section class="auth-section">
        <div class="container">
            <div class="auth-box">
                <h2>🔐 تسجيل الدخول</h2>
                <div id="login-message"></div>
                <form id="login-form" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
                    </div>
                    <div class="form-group">
                        <label for="password">كلمة السر</label>
                        <input type="password" id="password" name="password" placeholder="أدخل كلمة السر" required>
                    </div>
                    <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
                </form>
                <div class="auth-link">
                    ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
                </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>🛒 سوقي</h3>
                    <p>أول سوق مغربي للإعلانات المبوبة.</p>
                </div>
                <div class="footer-col">
                    <h3>روابط سريعة</h3>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="post-ad.html">نشر إعلان</a></li>
                    </ul>
                </div>
            <div class="footer-bottom">
                <p>© 2026 سوقي - جميع الحقوق محفوظة</p>
            </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
