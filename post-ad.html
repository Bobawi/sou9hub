<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر إعلان جديد - سوقي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1><a href="index.html">🛒 سوقي</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="categories.html">الفئات</a></li>
                    <li><a href="post-ad.html" class="btn-post">+ نشر إعلان</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">تسجيل الدخول</a>
                <a href="register.html" class="btn-register">إنشاء حساب</a>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <section class="post-section">
        <div class="container">
            <div class="post-box">
                <h2>📢 نشر إعلان جديد</h2>
                <div id="post-message"></div>
                <form id="post-ad-form" onsubmit="return handlePostAd(event)" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="title">عنوان الإعلان</label>
                        <input type="text" id="title" name="title" placeholder="اكتب عنواناً واضحاً لإعلانك" required>
                    </div>
                    <div class="form-group">
                        <label for="category">الفئة</label>
                        <select id="category" name="category" required>
                            <option value="">اختر الفئة</option>
                            <option value="cars">🚗 السيارات</option>
                            <option value="real-estate">🏠 العقارات</option>
                            <option value="electronics">📱 الإلكترونيات</option>
                            <option value="jobs">💼 الوظائف</option>
                            <option value="services">🔧 الخدمات</option>
                            <option value="fashion">👕 الموضة</option>
                            <option value="kids">👶 مستلزمات الأطفال</option>
                            <option value="animals">🐾 الحيوانات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="price">السعر (درهم)</label>
                        <input type="number" id="price" name="price" placeholder="0" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="description">الوصف</label>
                        <textarea id="description" name="description" placeholder="اكتب وصفاً مفصلاً لمنتجك أو خدمتك" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="city">المدينة</label>
                        <input type="text" id="city" name="city" placeholder="أدخل مدينتك">
                    </div>
                    <div class="form-group">
                        <label for="phone">رقم الهاتف للاتصال</label>
                        <input type="tel" id="phone" name="phone" placeholder="أدخل رقم هاتفك" required>
                    </div>
                    <button type="submit" class="btn btn-primary">📨 نشر الإعلان</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>🛒 سوقي</h3>
                    <p>أول سوق مغربي للإعلانات المبوبة.</p>
                </div>
                <div class="footer-col">
                    <h3>روابط سريعة</h3>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="login.html">تسجيل الدخول</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 سوقي - جميع الحقوق محفوظة</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
